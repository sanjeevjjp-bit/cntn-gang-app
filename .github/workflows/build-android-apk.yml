name: Build CNTN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      -.github/workflows/build-android-apk.yml
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web dependencies
        run: npm install
      - name: Build web bundle
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
              - name: Generate CNTN launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for item in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $item
            density=$1
            size=$2
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert cntn-icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
