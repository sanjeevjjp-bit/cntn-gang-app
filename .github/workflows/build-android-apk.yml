name: Build CNTN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      -.github/workflows/build-android-apk.yml
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web dependencies
        run: npm install
      - name: Build web bundle
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
              - name: Generate CNTN launcher icons
        run: |
          npm install --no-save sharp
          node --input-type=module -e "
          import sharp from 'sharp';
          import fs from 'node:fs';
          const input = fs.readFileSync('cntn-icon.png');
          const sizes = [
            ['mdpi', 48],
            ['hdpi', 72],
            ['xhdpi', 96],
            ['xxhdpi', 144],
            ['xxxhdpi', 192]
          ];
          for (const [density, size] of sizes) {
            const dir = \`android/app/src/main/res/mipmap-\${density}\`;
            fs.mkdirSync(dir, { recursive: true });
            await sharp(input).resize(size, size).png().toFile(\`\${dir}/ic_launcher.png\`);
            await sharp(input).resize(size, size).png().toFile(\`\${dir}/ic_launcher_round.png\`);
          }
          "
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CNTN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
