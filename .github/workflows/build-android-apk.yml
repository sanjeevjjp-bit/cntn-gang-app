name: Build CNTN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'google-services.json'
      - 'cntn-icon.png'
# Note: the app loads the live website, so changes to src/ or public/ reach
# phones by themselves. A new APK is only needed for native changes (this list).

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Firebase and app icon
        shell: bash
        run: |
          set -e

          test -f google-services.json
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")

          if not root.exists() or not app.exists():
              raise SystemExit("Expected Gradle files not found")

          root_text = root.read_text()
          plugin = "classpath 'com.google.gms:google-services:4.4.2'"

          if plugin not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Root Gradle dependencies block not found")
              root.write_text(root_text.replace(
                  marker, marker + "\n        " + plugin, 1
              ))

          app_text = app.read_text()
          apply_plugin = "apply plugin: 'com.google.gms.google-services'"

          if apply_plugin not in app_text:
              app.write_text(app_text.rstrip() + "\n\n" + apply_plugin + "\n")
          PY

          if [ -f cntn-icon.png ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick

            for item in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
              set -- $item
              density=$1
              size=$2
              dir="android/app/src/main/res/mipmap-$density"
              mkdir -p "$dir"
              convert cntn-icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
              cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            done

            # Newer Android versions prefer Capacitor's default adaptive icon
            # and would ignore the logo above. Remove it so the logo is used.
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Allow notifications on Android 13+
        shell: bash
        run: |
          set -e
          manifest=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$manifest"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$manifest"
          fi
          grep -q "android.permission.POST_NOTIFICATIONS" "$manifest"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # A permanent signing key means every future APK can be installed over
      # the previous one without uninstalling. Without it, each build gets a
      # random key and Android refuses to update the app.
      - name: Use permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 repository secret first (GitHub repo > Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CNTN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Public download link used by the in-app "Update required" popup:
      # https://github.com/<owner>/<repo>/releases/latest/download/CNTN.apk
      - name: Publish APK download link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CNTN.apk
          gh release delete apk-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create apk-latest CNTN.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CNTN app (latest)" \
            --notes "Latest CNTN Android app, built $(date -u +%F)." \
            --latest
