name: Build CNTN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      -.github/workflows/build-android-apk.yml
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install web dependencies
        run: npm install
      - name: Build web bundle
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
        name: Sync Capacitor
        run: npx cap sync android

      - name: Generate CNTN launcher icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          npx --yes sharp-cli -i cntn-icon.png resize 48 48 -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          npx --yes sharp-cli -i cntn-icon.png resize 72 72 -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          npx --yes sharp-cli -i cntn-icon.png resize 96 96 -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          npx --yes sharp-cli -i cntn-icon.png resize 144 144 -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          npx --yes sharp-cli -i cntn-icon.png resize 192 192 -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
